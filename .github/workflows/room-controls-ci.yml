name: Room controls CI

on:
  push:
    branches:
      - room-controls-2p

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - run: node --check server.js
      - run: node --check public/app.js
