name: Import home background

on:
  push:
    paths:
      - ".github/workflows/import-home-background.yml"

permissions:
  contents: write

jobs:
  import-background:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download author artwork
        env:
          SOURCE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d650-8210-9141-0c2667465eec/raw?se=2026-10-03T14%3A52%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=5d4a411e-cea3-5285-b8df-ec0148aad3eb&skoid=ba81670d-b682-4d2d-9682-ac0ffdfb3fa1&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T08%3A07%3A53Z&ske=2026-10-04T08%3A07%3A53Z&sks=b&skv=2026-02-06&sig=GeIgS3k6IdnT5OizBydBGU72d8r9Ct9X7MlpX5TvnE4%3D"
        run: |
          mkdir -p public/assets
          curl --fail --location "$SOURCE_URL" --output /tmp/home-background.png
          file /tmp/home-background.png
      - name: Encode production WebP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          cwebp -quiet -q 88 -m 6 -mt /tmp/home-background.png -o public/assets/home-background.webp
          test -s public/assets/home-background.webp
      - name: Commit background
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/home-background.webp
          git commit -m "assets: add home menu background"
          git push
