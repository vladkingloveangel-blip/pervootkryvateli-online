databases:
  - name: pervootkryvateli-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: pervootkryvateli-online
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pervootkryvateli-db
          property: connectionString
